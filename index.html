<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Casquette</title>
<meta name="description" content="Les cadeaux en famille, sans gâcher la surprise.">
<meta name="theme-color" content="#a3203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Casquette">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/casquette-favicon-32.png">
<link rel="apple-touch-icon" href="icones/casquette-apple-touch-icon.png">
<style>
:root {
  --fond: #fbf6ef;
  --carte: #ffffff;
  --encre: #2a1f1d;
  --doux: #6f625d;
  --trait: #e8ddd2;
  --ruban: #a3203a;
  --ruban-fonce: #861a30;
  --ruban-pale: #f6e3e6;
  --or: #b88a2e;
  --or-pale: #f6eedc;
  --vert: #2f6b4f;
  --vert-pale: #e3efe8;
  --ombre: 0 1px 2px rgba(60, 30, 20, .06), 0 4px 14px rgba(60, 30, 20, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #1c1716;
    --carte: #272120;
    --encre: #f3ebe6;
    --doux: #b3a7a1;
    --trait: #3b3330;
    --ruban: #e0566f;
    --ruban-fonce: #c94660;
    --ruban-pale: #3e2328;
    --or: #d9b15c;
    --or-pale: #3a3122;
    --vert: #7cc29d;
    --vert-pale: #223229;
    --ombre: none;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.45;
  background: var(--fond);
  color: var(--encre);
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--ruban); }

.page { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

/* En-tête */
.entete {
  position: sticky; top: 0; z-index: 5;
  background: var(--fond);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 0;
  max-width: 560px; margin: 0 auto;
}
.entete-haut { display: flex; align-items: center; gap: 10px; }
.marque { font-size: 1.35rem; white-space: nowrap; font-weight: 750; letter-spacing: -.02em; color: var(--ruban); }
.groupe-nom {
  color: var(--doux); font-size: .95rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: none; border: none; text-align: left; cursor: pointer; padding: 8px 0;
}
.groupe-choix {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
}
.groupe-choix.actif { border: 2px solid var(--ruban); }
.groupe-choix-nom { font-weight: 650; }
.icone-btn {
  border: 1px solid var(--trait); background: var(--carte); border-radius: 999px;
  width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; font-size: 1.1rem;
}

/* Onglets des personnes */
.onglets {
  display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 12px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  border-bottom: 1px solid var(--trait);
}
.onglets::-webkit-scrollbar { display: none; }
.onglet {
  flex: none; border: 1px solid var(--trait); background: var(--carte);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; font-size: .95rem;
}
.onglet .nb { color: var(--doux); margin-left: 4px; font-size: .85rem; }
.onglet.actif { background: var(--ruban); border-color: var(--ruban); color: #fff; }
.onglet.actif .nb { color: rgba(255,255,255,.8); }
.onglet.offrir { border-style: dashed; }
.onglet.offrir.actif { border-style: solid; }
.onglet .point { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--or); margin-left: 6px; vertical-align: middle; }

h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -.02em; margin: 22px 0 6px; }
h2 { font-size: 1.15rem; margin: 26px 0 10px; }
.chapo { color: var(--doux); margin-bottom: 16px; }
.discret { color: var(--doux); font-size: .9rem; }

/* Cartes d'envie */
.envie {
  background: var(--carte); border: 1px solid var(--trait); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--ombre);
}
.envie-titre { font-weight: 650; font-size: 1.05rem; }
.envie-precision { color: var(--doux); margin-top: 2px; white-space: pre-wrap; }
.envie-lien { display: inline-block; margin-top: 6px; font-size: .95rem; text-decoration: none; word-break: break-all; }
.envie-pied { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.envie.prise { opacity: .72; }
.envie.retiree { border-color: var(--or); background: var(--or-pale); }
.avis { font-size: .9rem; margin-top: 8px; color: var(--or); font-weight: 600; }
.qui { font-size: .85rem; color: var(--doux); margin-bottom: 4px; }

.etiquette {
  display: inline-block; font-size: .85rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
}
.etiquette.moi { background: var(--vert-pale); color: var(--vert); }
.etiquette.autre { background: var(--trait); color: var(--doux); }

/* Boutons */
.btn {
  border: none; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600;
  background: var(--ruban); color: #fff; font-size: .98rem;
}
.btn:active { background: var(--ruban-fonce); }
.btn.large { width: 100%; padding: 14px 18px; font-size: 1.05rem; }
.btn.second { background: transparent; color: var(--encre); border: 1px solid var(--trait); }
.btn.lien { background: none; color: var(--doux); padding: 8px 6px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { background: transparent; color: var(--ruban); border: 1px solid var(--ruban); }
.btn:disabled { opacity: .5; cursor: default; }

/* Formulaires */
.form { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: var(--ombre); }
label { display: block; font-weight: 600; font-size: .95rem; margin: 12px 0 6px; }
label:first-child { margin-top: 0; }
label .opt { font-weight: 400; color: var(--doux); }
input[type=text], input[type=url], textarea {
  width: 100%; border: 1px solid var(--trait); border-radius: 10px; padding: 11px 12px;
  background: var(--fond); font-size: 16px;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, textarea:focus { outline: 2px solid var(--ruban); outline-offset: 1px; border-color: transparent; }
.rangee { display: flex; gap: 10px; margin-top: 16px; }
.rangee .btn { flex: 1; }

.ajout {
  width: 100%; border: 1.5px dashed var(--ruban); background: transparent; color: var(--ruban);
  border-radius: 14px; padding: 14px; font-weight: 650; cursor: pointer; margin-bottom: 16px; font-size: 1rem;
}

.principe {
  background: var(--ruban-pale); border-radius: 12px; padding: 10px 14px; font-size: .92rem; margin-bottom: 16px;
}
.bandeau {
  background: var(--or-pale); border: 1px solid var(--or); border-radius: 12px; padding: 10px 14px;
  font-size: .95rem; margin: 14px 0 0; cursor: pointer; text-align: left; width: 100%;
}

.vide { text-align: center; color: var(--doux); padding: 34px 10px; }
.vide .grand { font-size: 2.2rem; margin-bottom: 6px; }

ul.mode { list-style: none; margin: 6px 0 22px; }
ul.mode li { display: flex; gap: 12px; margin-bottom: 12px; }
.mode-ic { font-size: 1.4rem; line-height: 1.2; flex: none; }

.reglage { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.reglage p { margin-bottom: 10px; }
.membre { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--trait); }
.membre:first-of-type { border-top: none; }

.retour { margin: 14px 0 0; }

.budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.budget > div { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 8px; text-align: center; }
.budget-lib { font-size: .78rem; color: var(--doux); text-transform: uppercase; letter-spacing: .04em; }
.budget-val { font-weight: 700; font-size: 1.05rem; margin-top: 2px; white-space: nowrap; }
.budget-val.vert { color: var(--vert); }
h2.pour { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2.pour .discret { font-weight: 500; }
.ligne {
  display: flex; align-items: flex-start; gap: 12px; background: var(--carte); border: 1px solid var(--trait);
  border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 8px; box-shadow: var(--ombre);
}
.ligne.faite { opacity: .62; }
.ligne.faite .ligne-titre { text-decoration: line-through; text-decoration-color: var(--doux); }
.coche {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--trait); background: var(--fond);
  cursor: pointer; font-weight: 800; color: #fff; display: grid; place-items: center; margin-top: 1px; font-size: .95rem;
}
.coche.oui { background: var(--vert); border-color: var(--vert); }
.ligne-corps { flex: 1; min-width: 0; }
.ligne-titre { font-weight: 650; }
.ligne-sous { font-size: .88rem; color: var(--doux); }
.ligne-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .9rem; margin-top: 2px; }
.ligne-actions a { text-decoration: none; }
.ligne-actions .btn.lien { padding: 4px 0; font-size: .88rem; }
input.prix {
  flex: none; width: 82px; text-align: right; border: 1px solid var(--trait); border-radius: 10px;
  padding: 7px 8px; background: var(--fond); font-size: 16px;
}

.pastille { display: inline-grid; place-items: center; border-radius: 50%; flex: none; vertical-align: middle; overflow: hidden; }
.pastille img { width: 82%; height: 82%; object-fit: contain; }
.pastille.initiale { background: var(--trait); color: var(--doux); font-weight: 700; }
.onglet { display: inline-flex; align-items: center; gap: 6px; }
.onglet .pastille { margin-left: -6px; }
.onglet.actif .pastille.initiale { background: rgba(255,255,255,.25); color: #fff; }
h1 .pastille, h2 .pastille { margin-right: 8px; }
.animaux { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 8px 0 18px; }
.animal {
  border: 1.5px solid var(--trait); background: var(--carte); border-radius: 14px; padding: 8px 2px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 600; min-height: 84px;
  line-height: 1.15; text-align: center; overflow-wrap: anywhere; hyphens: auto;
}
.animal img { width: 40px; height: 40px; }
.animal[aria-pressed="true"] { border: 3px solid var(--ruban); background: var(--ruban-pale); }
.animal:disabled { opacity: .35; cursor: default; }
.animal .pris { font-weight: 400; color: var(--doux); font-size: .65rem; }

.tirage { background: var(--carte); border: 2px solid var(--or); border-radius: 16px; padding: 16px; margin: 16px 0; box-shadow: var(--ombre); }
.tirage p { margin: 6px 0 12px; }
.tirage-tete { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; color: var(--or); }
.tirage-tete span { color: var(--encre); }
.tirage-qui { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; margin: 12px 0; }
.tirage-mot { color: var(--doux); font-style: italic; }
.tirage.vu { border-color: var(--trait); }
.case { display: flex; align-items: center; gap: 10px; font-weight: 500; margin: 0; padding: 8px 0; cursor: pointer; }
.case input { width: 20px; height: 20px; accent-color: var(--ruban); }
details.exclu { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
details.exclu summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; }
details.exclu summary::-webkit-details-marker { display: none; }
.exclu-nom { font-weight: 650; }
details.exclu summary .discret { margin-left: auto; text-align: right; }
.secousse {
  position: fixed; inset: 0; z-index: 30; background: rgba(28, 23, 22, .72); color: #fff; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.chapeau-anim svg { width: 220px; height: auto; animation: secoue .35s ease-in-out infinite alternate; transform-origin: 50% 80%; }
@keyframes secoue { from { transform: rotate(-9deg) translateY(0); } to { transform: rotate(9deg) translateY(-8px); } }

#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--encre); color: var(--fond); padding: 11px 18px; border-radius: 999px; font-size: .95rem;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 20;
}
#toast.visible { opacity: 1; transform: translateX(-50%); }

.chargement { text-align: center; padding: 60px 0; color: var(--doux); }
</style>
</head>
<body>
<div id="app"><div class="chargement">Un instant…</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* Adresse du petit serveur (même hébergement que Grazie, dans www/sorpresa).
   La Casquette s'appelait d'abord Sorpresa : le chemin du serveur et la clé de mémoire gardent ce nom,
   pour que rien ne se perde sur les téléphones déjà installés. */
const API_PAR_DEFAUT = 'https://azertida.alwaysdata.net/sorpresa/api.php';
const EN_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API = (EN_LOCAL && new URLSearchParams(location.search).get('api')) || API_PAR_DEFAUT;
const CLE = 'sorpresa';

/* ---------- Mémoire du téléphone ----------
   Plusieurs groupes : { groupes: [{ g, m, j, admin?, nom? }], actif }.
   Une ancienne mémoire à un seul groupe ({ g, m, j, admin? }) est reprise telle quelle. */
function lireEtat() {
  let brut = null;
  try { brut = JSON.parse(localStorage.getItem(CLE)); } catch (e) {}
  if (brut && Array.isArray(brut.groupes)) {
    const groupes = brut.groupes.filter(x => x && x.m && x.j && x.g);
    return { groupes, actif: Math.min(Math.max(0, brut.actif | 0), Math.max(0, groupes.length - 1)) };
  }
  if (brut && brut.m && brut.j && brut.g) return { groupes: [brut], actif: 0 };
  return { groupes: [], actif: 0 };
}
function enregistrer() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
}
/* Garde ce groupe (nouveau ou modifié) et en fait le groupe affiché. */
function garder(x) {
  let i = etat.groupes.indexOf(x);
  if (i < 0) i = etat.groupes.findIndex(y => y.m === x.m);
  if (i < 0) { etat.groupes.push(x); i = etat.groupes.length - 1; } else etat.groupes[i] = x;
  etat.actif = i; moi = x;
  enregistrer();
}
/* Retire le groupe affiché de ce téléphone, et passe au suivant s'il y en a un. */
function oublier() {
  const i = etat.groupes.indexOf(moi);
  if (i >= 0) etat.groupes.splice(i, 1);
  etat.actif = 0; moi = etat.groupes[0] || null;
  enregistrer();
}
function choisirGroupe(i) {
  etat.actif = i; moi = etat.groupes[i]; enregistrer();
  donnees = null; vue = 'moi'; edition = null;
  app.replaceChildren(el('div', { class: 'chargement' }, 'Un instant…'));
  charger();
}
const cleGestion = () => (etat.groupes.find(x => x.admin) || {}).admin || '';

/* Les animaux : ceux de Corsia (aquatiques) et ceux d'ici. Images Fluent Emoji (Microsoft, MIT), dossier animaux/. */
const ANIMAUX = [
  ['poulpe', 'Poulpe'], ['capybara', 'Capybara'], ['loutre', 'Loutre'], ['tortue', 'Tortue'],
  ['meduse', 'Méduse'], ['dauphin', 'Dauphin'], ['phoque', 'Phoque'], ['manchot', 'Manchot'],
  ['baleine', 'Baleine'], ['grenouille', 'Grenouille'], ['raie', 'Raie manta'], ['hippocampe', 'Hippocampe'],
  ['renard', 'Renard'], ['herisson', 'Hérisson'], ['ecureuil', 'Écureuil'], ['chouette', 'Chouette'],
  ['chat', 'Chat'], ['chien', 'Chien'], ['abeille', 'Abeille'],
  ['panda', 'Panda'], ['koala', 'Koala'], ['paresseux', 'Paresseux'],
  ['perroquet', 'Perroquet'], ['paon', 'Paon'], ['papillon', 'Papillon'],
];
const FOND = {
  poulpe: '#FBE3DA', capybara: '#F3E6D6', loutre: '#F3E6D6', tortue: '#E2EEDA', meduse: '#EEE5F7', dauphin: '#E3EEF4',
  phoque: '#E9ECEF', manchot: '#E9ECEF', baleine: '#E3EEF4', grenouille: '#E2EEDA', raie: '#E3EEF4', hippocampe: '#FBEFD5',
  renard: '#FBE3DA', herisson: '#F3E6D6', ecureuil: '#FBEFD5', chouette: '#F3E6D6', chat: '#FBEFD5', chien: '#F3E6D6',
  abeille: '#FBEFD5', panda: '#EEE5F7', koala: '#E9ECEF', paresseux: '#F3E6D6', perroquet: '#E2EEDA',
  paon: '#E3EEF4', papillon: '#FBE3DA',
};
const NOM_ANIMAL = Object.fromEntries(ANIMAUX);

/* La casquette du tirage : le dessin de La Casquette d'origine. */
const CASQUETTE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 140 460 270" width="245" height="144" aria-hidden="true"> <defs> <pattern id="tweed" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"> <rect width="20" height="20" fill="#7E6D5A"/> <path d="M0 0 L10 7 L20 0 M0 10 L10 17 L20 10" stroke="#66584A" stroke-width="2.4" fill="none"/> <path d="M0 5 L10 12 L20 5" stroke="#948370" stroke-width="1.5" fill="none"/> </pattern> <pattern id="tweedFonce" width="16" height="16" patternUnits="userSpaceOnUse"> <rect width="16" height="16" fill="#5E5143"/> <path d="M0 0 L8 6 L16 0 M0 8 L8 14 L16 8" stroke="#4A3F34" stroke-width="2" fill="none"/> </pattern> <radialGradient id="doublure" cx="50%" cy="30%" r="70%"> <stop offset="0" stop-color="#6E4A2E"/> <stop offset="1" stop-color="#3B2A1D"/> </radialGradient> <clipPath id="dedans"><path d="M0 0 L512 0 L512 252 L428 252 A160 40 0 0 1 108 252 L0 252 Z"/></clipPath> </defs> <g transform="translate(256 268) scale(1.04) translate(-258 -300)"> <!-- ombre --> <ellipse cx="262" cy="398" rx="170" ry="18" fill="#2B2118" opacity=".13"/> <!-- calotte retournée --> <g transform="translate(0 600) scale(1 -1)"> <path d="M424 358 C452 342 458 270 416 246 C352 214 254 234 172 274 C130 294 102 316 110 336 C126 350 160 352 200 354 Z" fill="url(#tweed)" stroke="#3E342A" stroke-width="5" stroke-linejoin="round"/> <path d="M120 326 C176 298 262 266 356 250" fill="none" stroke="#3E342A" stroke-width="4" stroke-linecap="round" opacity=".6"/> <circle cx="140" cy="318" r="7" fill="#4A3F34"/> </g> <!-- visière : un croissant posé à plat contre le bord avant de l\'ouverture --> <path d="M150 225 C94 219 44 234 38 255 C44 276 94 290 150 279 A160 40 0 0 1 150 225 Z" fill="url(#tweedFonce)" stroke="#3E342A" stroke-width="5" stroke-linejoin="round"/> <path d="M140 234 C104 234 76 244 70 254" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".15"/> <!-- ouverture : l\'intérieur doublé --> <ellipse cx="268" cy="252" rx="160" ry="40" fill="url(#doublure)" stroke="#3E342A" stroke-width="5"/> <g clip-path="url(#dedans)" stroke="#9C7A45" stroke-width="4" stroke-linejoin="round"> <g transform="translate(318 244) rotate(16)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#DDBB7E"/><line x1="0" y1="-26" x2="0" y2="26" stroke-dasharray="7 6" stroke-width="3"/></g> <g transform="translate(232 240) rotate(-14)"><rect x="-44" y="-28" width="88" height="56" rx="4" fill="#E7C98F"/><line x1="0" y1="-28" x2="0" y2="28" stroke-dasharray="7 6" stroke-width="3"/></g> <g transform="translate(284 262) rotate(4)"><rect x="-36" y="-23" width="72" height="46" rx="4" fill="#E7C98F"/><line x1="0" y1="-23" x2="0" y2="23" stroke-dasharray="6 5" stroke-width="3"/></g> <g transform="translate(372 250) rotate(34)"><rect x="-28" y="-18" width="56" height="36" rx="4" fill="#DDBB7E"/><line x1="0" y1="-18" x2="0" y2="18" stroke-dasharray="6 5" stroke-width="3"/></g> </g> <path d="M108 252 A160 40 0 0 0 428 252" fill="none" stroke="#3E342A" stroke-width="5"/> </g> </svg>';

/* Une pastille ronde : l'animal de la personne, ou à défaut l'initiale de son prénom. */
function pastille(animal, prenom, taille = 26) {
  const st = 'width:' + taille + 'px;height:' + taille + 'px';
  if (animal && FOND[animal]) {
    return el('span', { class: 'pastille', style: st + ';background:' + FOND[animal], title: NOM_ANIMAL[animal] },
      el('img', { src: 'animaux/' + animal + '.png', alt: '' }));
  }
  return el('span', { class: 'pastille initiale', style: st + ';font-size:' + Math.round(taille * .48) + 'px' },
    (String(prenom || '?').trim()[0] || '?').toUpperCase());
}

let etat = lireEtat();
let moi = etat.groupes[etat.actif] || null;   // le groupe affiché : { g, m, j, admin?, nom? }
let donnees = null;      // dernière réponse de « liste »
let vue = 'moi';         // 'moi', 'offrir', 'reglages' ou l'alias d'une personne
let edition = null;      // id de l'envie en cours de modification, ou 'nouvelle'

/* ---------- Petits outils ---------- */
const app = document.getElementById('app');

function el(balise, attrs, ...enfants) {
  const n = document.createElement(balise);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const e of enfants.flat()) {
    if (e == null || e === false) continue;
    n.append(e instanceof Node ? e : document.createTextNode(String(e)));
  }
  return n;
}

let minuteur;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(minuteur);
  minuteur = setTimeout(() => t.classList.remove('visible'), 2600);
}

async function appel(action, champs = {}, lecture = false) {
  const base = { action, ...champs };
  if (moi && moi.g && !('g' in champs)) base.g = moi.g;
  if (moi && moi.m && !('m' in champs)) { base.m = moi.m; base.j = moi.j; }
  if (moi && moi.admin) base.admin = moi.admin;
  for (const k of Object.keys(base)) if (base[k] === undefined) delete base[k];
  let rep;
  try {
    rep = lecture
      ? await fetch(API + '?' + new URLSearchParams(base), { cache: 'no-store' })
      : await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(base) });
  } catch (e) {
    throw new Error('Pas de connexion pour l\'instant');
  }
  let corps = {};
  try { corps = await rep.json(); } catch (e) {}
  if (!rep.ok) {
    const err = new Error(corps.erreur || 'Le serveur ne répond pas');
    err.statut = rep.status;
    throw err;
  }
  return corps;
}

function domaine(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'lien'; }
}

function lienSur(url) {
  return /^https?:\/\//i.test(url) ? url : null;
}

function lienInvitation() {
  const base = location.origin + location.pathname;
  const p = donnees && donnees.moi ? '&p=' + donnees.moi : '';
  return base + '#g=' + moi.g + p;
}

/* ---------- Chargement ---------- */
async function charger() {
  try {
    donnees = await appel('liste', {}, true);
  } catch (e) {
    if (e.statut === 404 && moi && moi.m) {
      // Le lien du groupe a changé : la place de membre suffit pour le retrouver.
      try {
        const r = await appel('retrouver', { m: moi.m, j: moi.j });
        moi.g = r.g; garder(moi);
        donnees = await appel('liste', {}, true);
      } catch (e2) {
        return ecranPerdu();
      }
    } else if (e.statut === 403) {
      return ecranPerdu();
    } else {
      if (!donnees) { app.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'vide' }, el('div', { class: 'grand' }, '📡'), e.message, el('div', { style: 'margin-top:16px' }, el('button', { class: 'btn', onclick: charger }, 'Réessayer'))))); }
      else toast(e.message);
      return;
    }
  }
  if (moi && moi.nom !== donnees.nom) { moi.nom = donnees.nom; enregistrer(); }
  if (vue !== 'moi' && vue !== 'offrir' && vue !== 'reglages' && vue !== 'animal' && vue !== 'tirage' && !donnees.personnes.some(p => p.p === vue)) vue = 'moi';
  rendre();
}

/* ---------- Écrans hors groupe ---------- */
function ecranAccueil() {
  app.replaceChildren(el('div', { class: 'page' },
    el('h1', { style: 'margin-top:48px' }, el('span', { style: 'color:var(--ruban)' }, 'La Casquette')),
    el('p', { class: 'chapo' }, 'Les cadeaux en famille, sans gâcher la surprise.'),
    modeEmploi(),
    formulaireColler(),
    el('button', { class: 'btn second large', onclick: ecranCreer }, 'Créer un groupe'),
    etat.groupes.length ? el('button', { class: 'btn lien retour', onclick: ecranGroupes }, '← Mes groupes') : null
  ));
}

/* Mes groupes : passer de l'un à l'autre, en rejoindre ou en créer un autre */
function ecranGroupes() {
  const bloc = el('div', { class: 'page' },
    el('h1', { style: 'margin-top:40px' }, 'Mes groupes'),
    el('p', { class: 'chapo' }, 'Chaque groupe a ses listes et ses réservations. Touche celui que tu veux ouvrir.'));
  etat.groupes.forEach((x, i) => {
    bloc.append(el('button', { class: 'groupe-choix' + (x === moi ? ' actif' : ''), onclick: () => choisirGroupe(i) },
      el('span', { class: 'groupe-choix-nom' }, x.nom || 'Groupe sans nom'),
      el('span', { class: 'discret' }, (x.admin ? 'Tu le gères' : '') + (x === moi ? (x.admin ? ' · ' : '') + 'ouvert' : ''))));
  });
  bloc.append(el('h2', {}, 'Ajouter un groupe'), formulaireColler());
  if (cleGestion()) bloc.append(el('button', { class: 'btn second large', onclick: ecranCreer }, 'Créer un nouveau groupe'));
  if (moi) bloc.append(el('button', { class: 'btn lien retour', onclick: () => { if (donnees) { vue = 'moi'; rendre(); } else charger(); } }, '← Retour'));
  app.replaceChildren(bloc);
}

/* Coller un lien : invitation (#g=…) ou lien de secours (#s=…).
   Indispensable dans l'appli installée, qui n'a pas de barre d'adresse. */
function formulaireColler() {
  const champ = el('input', { type: 'text', placeholder: 'Colle ici ton lien', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  return el('form', { class: 'form', novalidate: true, onsubmit: async (ev) => {
    ev.preventDefault();
    const t = champ.value.trim();
    const h = new URLSearchParams((t.includes('#') ? t.slice(t.indexOf('#') + 1) : t));
    if (h.get('s')) return restaurer(h.get('s'));
    const g = h.get('g');
    if (g && /^[0-9a-f]{18}$/.test(g)) {
      const i = etat.groupes.findIndex(x => x.g === g);
      if (i >= 0) { toast('Tu fais déjà partie de ce groupe'); return choisirGroupe(i); }
      return ecranRejoindre(g, (h.get('p') || '').replace(/[^0-9a-f]/g, '').slice(0, 10));
    }
    toast('Ce n\'est pas un lien de La Casquette');
  }},
    el('label', {}, 'Tu as reçu un lien d\'invitation, ou tu as ton lien de secours ?'),
    champ,
    el('div', { class: 'rangee' }, el('button', { class: 'btn', type: 'submit' }, 'Ouvrir'))
  );
}

/* Sur iPhone (et dans Safari sur Mac), l'appli installée ne partage pas la mémoire de Safari. */
function memoireSeparee() {
  const installee = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (installee) return false;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const safariMac = /Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg|Firefox/.test(ua);
  return ios || safariMac;
}

function lienSecours() {
  return location.origin + location.pathname + '#s=' +
    etat.groupes.map(x => [x.m, x.j].concat(x.admin ? [x.admin] : []).join('.')).join('~');
}

async function restaurer(code) {
  const morceaux = String(code).split('~').map(t => t.split('.'));
  const valide = ([m, j, admin]) => /^[0-9a-f]{12}$/.test(m || '') && /^[0-9a-f]{32}$/.test(j || '') && (!admin || /^[0-9a-f]{32}$/.test(admin));
  if (!morceaux.length || !morceaux.every(valide)) {
    toast('Ce lien de secours est incomplet');
    if (!moi) ecranAccueil();
    return;
  }
  let retrouves = 0, perdus = 0, dernier = null;
  for (const [m, j, admin] of morceaux) {
    try {
      const r = await appel('retrouver', { m, j, g: undefined });
      const x = etat.groupes.find(y => y.m === m) || { m, j };
      x.g = r.g; x.j = j; x.nom = r.nom;
      if (admin) x.admin = admin;
      garder(x); dernier = x; retrouves++;
    } catch (e) {
      if (e.statut === 403) perdus++;
      else { toast(e.message); if (!moi) ecranAccueil(); return; }
    }
  }
  history.replaceState(null, '', location.pathname + location.search);
  if (!dernier) {
    toast('Ce lien ne correspond plus à personne');
    if (moi) charger(); else ecranAccueil();
    return;
  }
  choisirGroupe(etat.groupes.indexOf(dernier));
  toast(retrouves > 1 ? 'Te revoilà, dans tes ' + retrouves + ' groupes !' : 'Te revoilà !');
  if (perdus) setTimeout(() => toast(perdus > 1 ? perdus + ' groupes n\'existent plus' : 'Un groupe n\'existe plus'), 2800);
}

function modeEmploi() {
  const ligne = (ic, titre, texte) => el('li', {}, el('span', { class: 'mode-ic', 'aria-hidden': 'true' }, ic),
    el('span', {}, el('strong', {}, titre), ' : ' + texte));
  return el('div', {},
    el('ul', { class: 'mode' },
      ligne('🎁', 'Tes envies', 'note ce qui te ferait plaisir, au détail près, et retire-le quand tu l\'as reçu.'),
      ligne('🤫', 'Les envies des autres', 'réserve ce que tu offres. Personne ne voit ce qui est réservé sur sa propre liste.'),
      ligne('🛍️', 'À offrir', 'tes réservations et tes idées pour qui tu veux, avec prix, achats et budget, rien que pour toi.'),
      ligne('🎩', 'Le tirage au sort', 'la casquette désigne à qui chacun offre, façon Secret Santa, et tu découvres aussitôt sa liste.')),
    el('p', { class: 'discret', style: 'margin:-8px 0 20px' }, 'Un groupe par famille ou bande d\'amis, et un animal pour chacun.'));
}

function ecranCreer() {
  const nom = el('input', { type: 'text', maxlength: 40, placeholder: 'Ex. : La famille', autocomplete: 'off' });
  const prenom = el('input', { type: 'text', maxlength: 20, placeholder: 'Ton prénom', autocomplete: 'given-name' });
  const btn = el('button', { class: 'btn large', type: 'submit' }, 'Créer le groupe');
  const form = el('form', { class: 'form', onsubmit: async (ev) => {
    ev.preventDefault();
    if (!prenom.value.trim()) return toast('Il manque ton prénom');
    btn.disabled = true;
    try {
      const champs = { nom: nom.value };
      if (cleGestion()) champs.cle_existante = cleGestion();
      const c = await appel('creer_groupe', { ...champs, g: undefined, m: undefined });
      const r = await appel('rejoindre', { g: c.g, prenom: prenom.value, m: undefined });
      garder({ g: c.g, m: r.m, j: r.j, admin: c.admin, nom: nom.value.trim() });
      donnees = null; vue = 'animal';
      await charger();
      toast('Groupe créé. Invite les autres depuis ⚙︎');
    } catch (e) {
      btn.disabled = false;
      toast(e.statut === 403 ? 'Seule la personne qui gère un groupe peut en créer un autre' : e.message);
    }
  }},
    el('label', {}, 'Nom du groupe ', el('span', { class: 'opt' }, '(facultatif)')), nom,
    el('label', {}, 'Ton prénom'), prenom,
    el('div', { class: 'rangee' }, btn)
  );
  app.replaceChildren(el('div', { class: 'page' },
    el('h1', { style: 'margin-top:40px' }, 'Créer un groupe'),
    el('p', { class: 'chapo' }, 'Tu en seras la gestionnaire : toi seule pourras voir qui est inscrit, changer le lien ou retirer quelqu\'un.'),
    form,
    el('button', { class: 'btn lien', onclick: etat.groupes.length ? ecranGroupes : ecranAccueil }, '← Retour')
  ));
  prenom.focus();
}

async function ecranRejoindre(g, parrain) {
  let nom = '';
  try { nom = (await appel('apercu', { g, m: undefined }, true)).nom; }
  catch (e) {
    if (e.statut === 404) {
      app.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'vide' },
        el('div', { class: 'grand' }, '🎁'),
        'Ce lien ne mène plus nulle part. Demande le nouveau à la personne qui t\'a invitée.')));
      return;
    }
    app.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'vide' }, e.message)));
    return;
  }
  const prenom = el('input', { type: 'text', maxlength: 20, placeholder: 'Ton prénom', autocomplete: 'given-name' });
  const btn = el('button', { class: 'btn large', type: 'submit' }, 'Entrer');
  const form = el('form', { class: 'form', onsubmit: async (ev) => {
    ev.preventDefault();
    if (!prenom.value.trim()) return toast('Il manque ton prénom');
    btn.disabled = true;
    try {
      const r = await appel('rejoindre', { g, prenom: prenom.value, parrain: parrain || '', m: undefined });
      garder({ g, m: r.m, j: r.j, nom });
      history.replaceState(null, '', location.pathname + location.search);
      donnees = null; vue = 'animal';
      await charger();
      toast('Bienvenue !');
    } catch (e) {
      btn.disabled = false;
      toast(e.message);
    }
  }},
    el('label', {}, 'Ton prénom, tel que les autres te connaissent'), prenom,
    el('div', { class: 'rangee' }, btn)
  );
  app.replaceChildren(el('div', { class: 'page' },
    el('h1', { style: 'margin-top:40px' }, nom ? 'Tu rejoins « ' + nom + ' »' : 'Tu rejoins un groupe de La Casquette'),
    el('p', { class: 'chapo' }, 'Les cadeaux en famille, sans gâcher la surprise.'),
    modeEmploi(),
    etat.groupes.length ? el('div', { class: 'principe' }, 'Ce groupe s\'ajoutera à ceux que tu as déjà sur ce téléphone.') : null,
    memoireSeparee() && !etat.groupes.length ? el('div', { class: 'principe' },
      el('strong', {}, 'Tu veux La Casquette sur ton écran d\'accueil ? '),
      'Fais-le avant d\'entrer : l\'appli installée ne voit pas ce qui se passe ici. ',
      'Copie ce lien, ajoute la page à l\'écran d\'accueil (bouton Partager), ouvre l\'appli et colle-le.',
      el('div', { style: 'margin-top:10px' },
        el('button', { class: 'btn second', type: 'button', onclick: async () => {
          try { await navigator.clipboard.writeText(location.href); toast('Lien copié'); }
          catch (e) { prompt('Copie ce lien :', location.href); }
        }}, 'Copier le lien'))
    ) : null,
    form,
    etat.groupes.length ? el('button', { class: 'btn lien retour', onclick: ecranGroupes }, '← Mes groupes') : null
  ));
}

function ecranPerdu() {
  app.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'vide' },
    el('div', { class: 'grand' }, '🎁'),
    el('p', {}, 'Ce téléphone ne fait plus partie du groupe' + (moi && moi.nom ? ' « ' + moi.nom + ' »' : '') + '.'),
    el('p', { class: 'discret', style: 'margin-top:8px' }, 'Pour y revenir, ouvre à nouveau le lien d\'invitation.'),
    el('div', { style: 'margin-top:18px' }, el('button', { class: 'btn second', onclick: () => {
      oublier(); donnees = null;
      if (moi) choisirGroupe(etat.actif); else ecranAccueil();
    } }, 'Retirer ce groupe de ce téléphone'))
  )));
}

/* ---------- Écran principal ---------- */
function rendre() {
  const d = donnees;
  const autres = d.personnes.filter(p => !p.moi);
  const moiP = d.personnes.find(p => p.moi);
  const mesEnvies = d.envies.filter(e => e.mienne);
  const mesRes = d.envies.filter(e => e.ma_reservation);
  const retirees = d.envies.filter(e => e.retiree);
  const parPersonne = (alias) => d.envies.filter(e => e.p === alias && !e.retiree);

  const onglet = (cle, libelle, nb, extra, past) => el('button', {
    class: 'onglet' + (vue === cle ? ' actif' : '') + (extra ? ' ' + extra : ''),
    onclick: () => { vue = cle; edition = null; rendre(); window.scrollTo(0, 0); }
  }, past || null, libelle, nb != null ? el('span', { class: 'nb' }, nb) : null,
     cle === 'offrir' && retirees.length ? el('span', { class: 'point', title: 'À voir' }) : null);

  const entete = el('header', { class: 'entete' },
    el('div', { class: 'entete-haut' },
      el('div', { class: 'marque' }, 'La Casquette'),
      el('button', { class: 'groupe-nom', onclick: ecranGroupes, 'aria-label': 'Changer de groupe' },
        (d.nom || 'Mon groupe') + (etat.groupes.length > 1 ? ' · ' + etat.groupes.length : ''), el('span', { 'aria-hidden': 'true' }, ' ▾')),
      el('button', { class: 'icone-btn', 'aria-label': 'Actualiser', onclick: async () => { await charger(); toast('À jour'); } }, '↻'),
      el('button', { class: 'icone-btn', 'aria-label': 'Réglages', onclick: () => { vue = 'reglages'; rendre(); } }, '⚙︎')
    ),
    el('nav', { class: 'onglets' },
      onglet('moi', 'Ma liste', mesEnvies.length, null, moiP && moiP.animal ? pastille(moiP.animal, moiP.prenom, 24) : null),
      autres.map(p => onglet(p.p, (tiresParMoi().has(p.p) ? '🎩 ' : '') + p.prenom, parPersonne(p.p).length, null, pastille(p.animal, p.prenom, 24))),
      onglet('offrir', 'À offrir', elementsAOffrir().filter(i => !i.achete).length, 'offrir')
    )
  );

  let contenu;
  if (vue === 'moi') contenu = vueMaListe(mesEnvies, autres.length === 0);
  else if (vue === 'offrir') contenu = vueOffrir(mesRes, retirees);
  else if (vue === 'reglages') contenu = vueReglages();
  else if (vue === 'animal') contenu = vueAnimal();
  else if (vue === 'tirage') contenu = vueNouveauTirage();
  else {
    const p = d.personnes.find(x => x.p === vue);
    contenu = vueAutre(p, parPersonne(p.p), retirees.filter(e => e.p === p.p));
  }

  const bandeau = (retirees.length && vue !== 'offrir' && vue !== 'reglages')
    ? el('button', { class: 'bandeau', onclick: () => { vue = 'offrir'; rendre(); } },
        retirees.length === 1 ? '⚠︎ Une envie que tu avais réservée a été retirée. Voir' : '⚠︎ ' + retirees.length + ' envies que tu avais réservées ont été retirées. Voir')
    : null;

  app.replaceChildren(entete, el('main', { class: 'page' }, bandeau, contenu));
}

/* Ma liste */
function vueMaListe(envies, seule) {
  const bloc = el('div');
  cartesTirage().forEach(c => bloc.append(c));
  const moiP = donnees.personnes.find(p => p.moi);
  if (moiP && !moiP.animal) {
    bloc.append(el('button', { class: 'bandeau', style: 'border-color:var(--ruban);background:var(--ruban-pale)', onclick: () => { vue = 'animal'; rendre(); } },
      '🐾 Choisis ton animal : c\'est lui qui te représentera auprès des autres.'));
  }
  bloc.append(el('div', { class: 'principe', style: 'margin-top:16px' },
    'Tu ne sauras jamais si une de tes envies est réservée : c\'est tout le principe.'));

  if (edition === 'nouvelle') bloc.append(formulaire(null));
  else bloc.append(el('button', { class: 'ajout', onclick: () => { edition = 'nouvelle'; rendre(); } }, '＋ Ajouter une envie'));

  if (!envies.length && edition !== 'nouvelle') {
    bloc.append(el('div', { class: 'vide' }, el('div', { class: 'grand' }, '🎁'),
      'Ta liste est vide.', el('br'), 'Un film, un livre, une édition précise : note ce qui te ferait plaisir.'));
  }
  for (const e of envies) {
    if (edition === e.id) { bloc.append(formulaire(e)); continue; }
    bloc.append(el('div', { class: 'envie' },
      contenuEnvie(e),
      el('div', { class: 'envie-pied' },
        el('button', { class: 'btn second', onclick: () => { edition = e.id; rendre(); } }, 'Modifier'),
        el('button', { class: 'btn lien', onclick: () => retirer(e) }, 'Retirer')
      )
    ));
  }
  if (seule) {
    bloc.append(el('p', { class: 'discret', style: 'margin-top:18px;text-align:center' },
      'Tu es seule dans le groupe pour l\'instant. ',
      el('button', { class: 'btn lien', style: 'padding:0', onclick: inviter }, 'Inviter quelqu\'un')));
  }
  return bloc;
}

function contenuEnvie(e) {
  const url = e.lien && lienSur(e.lien);
  return [
    el('div', { class: 'envie-titre' }, e.titre),
    e.precision ? el('div', { class: 'envie-precision' }, e.precision) : null,
    url ? el('a', { class: 'envie-lien', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Voir sur ' + domaine(url) + ' ↗') : null
  ];
}

function formulaire(e) {
  const titre = el('input', { type: 'text', maxlength: 80, placeholder: 'Ex. : In the Mood for Love', value: e ? e.titre : '' });
  const precision = el('textarea', { maxlength: 200, placeholder: 'Ex. : le Blu-ray 4K, pas le DVD' });
  precision.value = e ? e.precision : '';
  const lien = el('input', { type: 'url', maxlength: 500, placeholder: 'https://…', inputmode: 'url', value: e ? e.lien : '' });
  const btn = el('button', { class: 'btn', type: 'submit' }, e ? 'Enregistrer' : 'Ajouter');
  const form = el('form', { class: 'form', novalidate: true, onsubmit: async (ev) => {
    ev.preventDefault();
    if (!titre.value.trim()) return toast('Il manque le titre');
    let l = lien.value.trim();
    if (l && !/^https?:\/\//i.test(l)) l = 'https://' + l;
    btn.disabled = true;
    try {
      if (e) await appel('modifier', { id: e.id, titre: titre.value, precision: precision.value, lien: l });
      else await appel('ajouter', { titre: titre.value, precision: precision.value, lien: l });
      edition = null;
      await charger();
      toast(e ? 'Envie modifiée' : 'Envie ajoutée');
    } catch (err) {
      btn.disabled = false;
      toast(err.message);
    }
  }},
    el('label', {}, 'Ton envie'), titre,
    el('label', {}, 'Précision ', el('span', { class: 'opt' }, '(facultatif)')), precision,
    el('label', {}, 'Lien ', el('span', { class: 'opt' }, '(facultatif)')), lien,
    el('div', { class: 'rangee' },
      el('button', { class: 'btn second', type: 'button', onclick: () => { edition = null; rendre(); } }, 'Annuler'),
      btn)
  );
  setTimeout(() => titre.focus(), 0);
  return form;
}

async function retirer(e) {

/* Liste de quelqu'un d'autre */
function vueAutre(p, envies, retirees) {

/* À offrir : mes réservations et mes notes privées, personne par personne (l'ancienne Mes Cadeaux) */
const euros = (v) => (v || 0).toLocaleString('fr-BE', { style: 'currency', currency: 'EUR' });
const cle = (t) => String(t || '').trim().toLocaleLowerCase('fr');

function elementsAOffrir() {
  const d = donnees;
  const prenomDe = {};
  d.personnes.forEach(p => { prenomDe[p.p] = p.prenom; });
  const items = [];
  for (const e of d.envies) {
    if (!e.ma_reservation || e.retiree) continue;
    items.push({ genre: 'res', id: e.id, pour: prenomDe[e.p] || '?', titre: e.titre, precision: e.precision, lien: e.lien,
                 prix: e.prix, achete: !!e.achete, modifiee_apres: e.modifiee_apres, envie: e });
  }
  for (const n of (d.notes || [])) items.push({ genre: 'note', id: n.id, pour: n.pour, titre: n.titre, prix: n.prix, achete: n.achete });
  return items;
}

function vueOffrir(mesRes, retirees) {
  const bloc = el('div');
  const items = elementsAOffrir();
  const total = items.reduce((t, i) => t + (i.prix || 0), 0);
  const achete = items.reduce((t, i) => t + (i.achete ? (i.prix || 0) : 0), 0);

  cartesTirage().forEach(c => bloc.append(c));
  bloc.append(el('h1', {}, 'À offrir'));
  bloc.append(el('p', { class: 'chapo' }, 'Ce que tu as réservé et tes idées à toi. Les prix et ce qui est acheté, toi seule les vois.'));
  if (items.length) {
    bloc.append(el('div', { class: 'budget' },
      el('div', {}, el('div', { class: 'budget-lib' }, 'Total'), el('div', { class: 'budget-val' }, euros(total))),
      el('div', {}, el('div', { class: 'budget-lib' }, 'Acheté'), el('div', { class: 'budget-val vert' }, euros(achete))),
      el('div', {}, el('div', { class: 'budget-lib' }, 'Reste'), el('div', { class: 'budget-val' }, euros(total - achete)))));
  }
  for (const e of retirees) bloc.append(carteRetiree(e, true));

  if (edition === 'note') bloc.append(formulaireNote());
  else bloc.append(el('button', { class: 'ajout', onclick: () => { edition = 'note'; rendre(); } }, '＋ Noter une idée de cadeau'));

  if (!items.length && !retirees.length && edition !== 'note') {
    bloc.append(el('div', { class: 'vide' }, el('div', { class: 'grand' }, '🛍️'),
      'Rien pour l\'instant.', el('br'),
      'Réserve une envie dans la liste de quelqu\'un, ou note une idée pour n\'importe qui, même hors du groupe.'));
    bloc.append(boutonImport('Tu utilisais Mes Cadeaux ? Importer son fichier'));
    return bloc;
  }

  // Les membres du groupe d'abord, dans l'ordre du groupe, puis les autres par ordre alphabétique.
  const groupes = new Map();
  for (const p of donnees.personnes) if (!p.moi) groupes.set(cle(p.prenom), { nom: p.prenom, animal: p.animal, membre: true, items: [] });
  const dehors = [];
  for (const i of items) {
    const k = cle(i.pour);
    if (!groupes.has(k)) { groupes.set(k, { nom: i.pour, items: [] }); dehors.push(k); }
    groupes.get(k).items.push(i);
  }
  for (const [, g] of groupes) {
    if (!g.items.length) continue;
    const sous = g.items.reduce((t, i) => t + (i.prix || 0), 0);
    bloc.append(el('h2', { class: 'pour' }, el('span', {}, g.membre ? pastille(g.animal, g.nom, 30) : null, 'Pour ' + g.nom), sous ? el('span', { class: 'discret' }, euros(sous)) : null));
    g.items.sort((a, b) => (a.achete - b.achete));
    for (const i of g.items) bloc.append(ligneAOffrir(i));
  }
  return bloc;
}

function ligneAOffrir(i) {
  const coche = el('button', { class: 'coche' + (i.achete ? ' oui' : ''), 'aria-pressed': i.achete ? 'true' : 'false',
    'aria-label': i.achete ? 'Acheté' : 'Pas encore acheté',
    onclick: () => enregistrerSuivi(i, { achete: !i.achete }) }, i.achete ? '✓' : '');
  const prix = el('input', { class: 'prix', type: 'text', inputmode: 'decimal', placeholder: 'Prix', 'aria-label': 'Prix',
    value: i.prix != null ? (Number.isInteger(i.prix) ? String(i.prix) : i.prix.toFixed(2).replace('.', ',')) : '' });
  prix.addEventListener('change', () => {
    const t = prix.value.trim().replace('€', '').replace(/\s/g, '').replace(',', '.');
    if (t !== '' && !(Number(t) >= 0)) { toast('Ce prix n\'est pas un nombre'); return; }
    enregistrerSuivi(i, { prix: t === '' ? '' : Number(t) });
  });
  prix.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') prix.blur(); });
  const url = i.lien && lienSur(i.lien);
  return el('div', { class: 'ligne' + (i.achete ? ' faite' : '') },
    coche,
    el('div', { class: 'ligne-corps' },
      el('div', { class: 'ligne-titre' }, i.titre),
      i.genre === 'res'
        ? el('div', { class: 'ligne-sous' }, 'Sur sa liste', i.precision ? ' · ' + i.precision : '')
        : el('div', { class: 'ligne-sous' }, 'Ton idée'),
      i.modifiee_apres ? el('div', { class: 'avis' }, 'Modifiée depuis ta réservation : vérifie la précision.') : null,
      el('div', { class: 'ligne-actions' },
        url ? el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, domaine(url) + ' ↗') : null,
        i.genre === 'res'
          ? el('button', { class: 'btn lien', onclick: () => liberer(i.envie) }, 'Annuler la réservation')
          : el('button', { class: 'btn lien', onclick: () => supprimerNote(i) }, 'Supprimer'))),
    prix);
}

async function enregistrerSuivi(i, champs) {
  try {
    if (i.genre === 'res') await appel('suivi', { id: i.id, ...champs });
    else await appel('note_modifier', { id: i.id, ...champs });
    await charger();
  } catch (err) { toast(err.message); }
}

async function supprimerNote(i) {
  if (!confirm('Supprimer « ' + i.titre + ' » (pour ' + i.pour + ') ?')) return;
  try { await appel('note_retirer', { id: i.id }); await charger(); toast('Idée supprimée'); }
  catch (err) { toast(err.message); }
}

function formulaireNote() {
  const noms = new Map();
  donnees.personnes.filter(p => !p.moi).forEach(p => noms.set(cle(p.prenom), p.prenom));
  (donnees.notes || []).forEach(n => { if (!noms.has(cle(n.pour))) noms.set(cle(n.pour), n.pour); });
  const liste = el('datalist', { id: 'noms-pour' }, [...noms.values()].map(n => el('option', { value: n })));
  const pour = el('input', { type: 'text', maxlength: 40, list: 'noms-pour', placeholder: 'Ex. : Maman', autocomplete: 'off' });
  const titre = el('input', { type: 'text', maxlength: 80, placeholder: 'Ex. : une écharpe en laine' });
  const prix = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Ex. : 25' });
  const btn = el('button', { class: 'btn', type: 'submit' }, 'Ajouter');
  const form = el('form', { class: 'form', novalidate: true, onsubmit: async (ev) => {
    ev.preventDefault();
    if (!pour.value.trim()) return toast('Il manque pour qui');
    if (!titre.value.trim()) return toast('Il manque l\'idée');
    const p = prix.value.trim().replace('€', '').replace(/\s/g, '').replace(',', '.');
    if (p !== '' && !(Number(p) >= 0)) return toast('Ce prix n\'est pas un nombre');
    btn.disabled = true;
    try {
      await appel('note_ajouter', { pour: pour.value, titre: titre.value, prix: p === '' ? '' : Number(p) });
      edition = null; await charger(); toast('Idée notée');
    } catch (err) { btn.disabled = false; toast(err.message); }
  }},
    el('p', { class: 'discret', style: 'margin-bottom:4px' }, 'Pour n\'importe qui, du groupe ou non. Personne d\'autre que toi ne la voit.'),
    el('label', {}, 'Pour qui'), pour, liste,
    el('label', {}, 'L\'idée'), titre,
    el('label', {}, 'Prix ', el('span', { class: 'opt' }, '(facultatif, en €)')), prix,
    el('div', { class: 'rangee' },
      el('button', { class: 'btn second', type: 'button', onclick: () => { edition = null; rendre(); } }, 'Annuler'),
      btn));
  setTimeout(() => pour.focus(), 0);
  return form;
}

/* Import du fichier exporté par Mes Cadeaux : [{ name, gifts: [{ description, price, bought }] }] */
function boutonImport(libelle) {
  const fichier = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  fichier.addEventListener('change', async () => {
    const f = fichier.files && fichier.files[0];
    fichier.value = '';
    if (!f) return;
    let personnes;
    try { personnes = JSON.parse(await f.text()); } catch (e) { return toast('Ce fichier est illisible'); }
    if (!Array.isArray(personnes)) return toast('Ce n\'est pas un fichier de Mes Cadeaux');
    const notes = [];
    for (const p of personnes) {
      if (!p || !Array.isArray(p.gifts)) continue;
      for (const g of p.gifts) {
        if (!g || !String(g.description || '').trim()) continue;
        notes.push({ pour: String(p.name || '?').slice(0, 40), titre: String(g.description).slice(0, 80),
                     prix: typeof g.price === 'number' && g.price > 0 ? g.price : '', achete: !!g.bought });
      }
    }
    if (!notes.length) return toast('Aucune idée de cadeau dans ce fichier');
    if (!confirm(notes.length + (notes.length > 1 ? ' idées' : ' idée') + ' de cadeau à importer dans « À offrir ». On y va ?')) return;
    try {
      const r = await appel('importer', { notes });
      vue = 'offrir'; await charger();
      toast(r.nb + (r.nb > 1 ? ' idées importées' : ' idée importée'));
    } catch (err) { toast(err.message); }
  });
  return el('div', { style: 'text-align:center;margin-top:6px' }, fichier,
    el('button', { class: 'btn second', onclick: () => fichier.click() }, libelle));
}

/* ---------- Tirage au sort ---------- */
function dejaVu(id) { return !!(moi && Array.isArray(moi.vus) && moi.vus.includes(id)); }
function marquerVu(id) {
  if (!moi) return;
  moi.vus = Array.isArray(moi.vus) ? moi.vus : [];
  if (!moi.vus.includes(id)) moi.vus.push(id);
  const ids = new Set((donnees.tirages || []).map(t => t.id));
  moi.vus = moi.vus.filter(x => ids.has(x));     // on oublie les tirages annulés
  enregistrer();
}
function tiresParMoi() {
  return new Set((donnees && donnees.tirages || []).filter(t => t.p && dejaVu(t.id)).map(t => t.p));
}

function cartesTirage() {
  return (donnees.tirages || []).map(t => {
    const p = donnees.personnes.find(x => x.p === t.p);
    if (!dejaVu(t.id)) {
      return el('div', { class: 'tirage' },
        el('div', { class: 'tirage-tete' }, '🎩 Tirage au sort', el('span', {}, t.nom)),
        el('p', {}, 'La casquette a choisi à qui tu offres. Personne d\'autre que toi ne le saura.'),
        el('button', { class: 'btn large', onclick: () => decouvrir(t) }, 'Découvrir à qui j\'offre'));
    }
    return el('div', { class: 'tirage vu' },
      el('div', { class: 'tirage-tete' }, '🎩 ' + t.nom),
      p ? el('div', { class: 'tirage-qui' }, pastille(p.animal, p.prenom, 46), el('span', {}, 'Tu offres à ', el('strong', {}, p.prenom)))
        : el('div', { class: 'tirage-qui' }, el('span', {}, t.prenom + ', que tu avais tirée, a quitté le groupe.')),
      t.mot ? el('p', { class: 'tirage-mot' }, '« ' + t.mot + ' »') : null,
      p ? el('button', { class: 'btn second', onclick: () => { vue = p.p; rendre(); window.scrollTo(0, 0); } }, 'Voir les envies de ' + p.prenom) : null);
  });
}

function decouvrir(t) {
  const fini = () => { marquerVu(t.id); rendre(); window.scrollTo(0, 0); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return fini();
  const voile = el('div', { class: 'secousse', role: 'status' });
  const chapeau = el('div', { class: 'chapeau-anim' });
  chapeau.innerHTML = CASQUETTE_SVG;
  voile.append(chapeau, el('div', {}, 'La casquette mélange les noms…'));
  document.body.append(voile);
  setTimeout(() => { voile.remove(); fini(); }, 1700);
}

function blocTirages() {
  const liste = donnees.tirages_gestion || [];
  return el('div', { class: 'reglage' },

      el('button', { class: 'btn lien', onclick: () => annulerTirage(t) }, 'Annuler'))),

async function annulerTirage(t) {

function vueNouveauTirage() {
  const membres = donnees.personnes;
  const annee = new Date().getFullYear();
  const nom = el('input', { type: 'text', maxlength: 40, list: 'occasions', value: 'Noël ' + annee });
  const occasions = el('datalist', { id: 'occasions' },
    ['Noël ' + annee, 'Saint-Nicolas ' + annee, 'Fête des mères', 'Fête des pères', 'Anniversaire de '].map(o => el('option', { value: o })));
  const mot = el('textarea', { maxlength: 200, placeholder: 'Ex. : budget 30 €, cadeaux le 24 au soir' });
  const coches = new Map();
  const exclus = new Map();   // donneur → Set des receveurs exclus
  membres.forEach(m => { coches.set(m.p, true); exclus.set(m.p, new Set()); });
  const zoneEx = el('div');
  const erreurZone = el('p', { class: 'avis', style: 'display:none' });

  function rendreExclusions() {
    const part = membres.filter(m => coches.get(m.p));
    zoneEx.replaceChildren(...part.map(m => {
      const ex = exclus.get(m.p);
      const resume = el('span', { class: 'discret' }, ex.size ? 'Pas à ' + part.filter(x => ex.has(x.p)).map(x => x.prenom).join(', ') : 'Aucune exclusion');
      return el('details', { class: 'exclu' },
        el('summary', {}, pastille(m.animal, m.prenom, 26), el('span', { class: 'exclu-nom' }, m.prenom), resume),
        el('p', { class: 'discret' }, m.prenom + ' ne peut pas offrir à :'),
        part.filter(x => x.p !== m.p).map(x => el('label', { class: 'case' },
          el('input', { type: 'checkbox', checked: ex.has(x.p), onchange: (ev) => { ev.target.checked ? ex.add(x.p) : ex.delete(x.p); const o = zoneEx.querySelectorAll('details'); const ouverts = [...o].map(d => d.open); rendreExclusions(); zoneEx.querySelectorAll('details').forEach((d, i) => { d.open = ouverts[i]; }); } }),
          pastille(x.animal, x.prenom, 22), x.prenom)));
    }));
  }

  const listeP = el('div', {}, membres.map(m => el('label', { class: 'case' },
    el('input', { type: 'checkbox', checked: true, onchange: (ev) => { coches.set(m.p, ev.target.checked); rendreExclusions(); } }),
    pastille(m.animal, m.prenom, 26), m.prenom + (m.moi ? ' (toi)' : ''))));
  rendreExclusions();

  const btn = el('button', { class: 'btn large', onclick: async () => {
    const participants = membres.filter(m => coches.get(m.p)).map(m => m.p);
    erreurZone.style.display = 'none';
    if (!nom.value.trim()) return toast('Donne un nom au tirage');
    if (participants.length < 3) return toast('Il faut au moins trois personnes pour garder le secret');
    const exclusions = {};
    participants.forEach(a => { exclusions[a] = [...exclus.get(a)].filter(x => participants.includes(x)); });
    if (!confirm('Lancer le tirage « ' + nom.value.trim() + ' » pour ' + participants.length + ' personnes ?')) return;
    btn.disabled = true;
    try {
      await appel('tirer', { nom: nom.value, mot: mot.value, participants, exclusions });
      vue = 'moi'; await charger();
      toast('La casquette a tiré au sort ! Chaque personne découvre la sienne dans l\'appli.');
    } catch (err) {
      btn.disabled = false;
      erreurZone.textContent = err.message; erreurZone.style.display = '';
    }
  }}, '🎩 Lancer le tirage');

  return el('div', {},
    el('h1', {}, 'Nouveau tirage'),
    el('p', { class: 'chapo' }, 'La casquette tire au sort à qui chaque personne offre. Personne ne peut se tirer soi-même, et personne, pas même toi, ne verra les paires.'),
    el('div', { class: 'form' },
      el('label', {}, 'Nom du tirage'), nom, occasions,
      el('label', {}, 'Un mot pour tout le monde ', el('span', { class: 'opt' }, '(facultatif)')), mot),
    el('h2', {}, 'Qui participe ?'), el('div', { class: 'form' }, listeP),
    el('h2', {}, 'Exclusions'),
    el('p', { class: 'discret', style: 'margin-bottom:8px' }, 'Ouvre un prénom pour dire à qui cette personne ne peut pas offrir (par exemple son ou sa partenaire). Une exclusion ne vaut que dans un sens.'),
    zoneEx, erreurZone,
    el('div', { style: 'margin-top:18px' }, btn),
    el('button', { class: 'btn lien retour', onclick: () => { vue = 'reglages'; rendre(); } }, '← Retour'));
}

/* Réglages */
function vueReglages() {
  const d = donnees;
  const moiP = d.personnes.find(p => p.moi);
  const bloc = el('div');
  bloc.append(el('h1', {}, 'Réglages'));

  bloc.append(el('div', { class: 'reglage' },
    el('p', {}, el('strong', {}, 'Inviter quelqu\'un'), el('br'), el('span', { class: 'discret' }, 'Envoie ce lien à une personne du groupe : elle choisira son prénom en l\'ouvrant.')),
    el('button', { class: 'btn', onclick: inviter }, 'Partager le lien')));

  bloc.append(el('div', { class: 'reglage', style: 'display:flex;align-items:center;gap:14px' },
    pastille(moiP && moiP.animal, moiP && moiP.prenom, 52),
    el('div', { style: 'flex:1' }, el('strong', {}, 'Mon animal'), el('br'),
      el('span', { class: 'discret' }, moiP && moiP.animal ? NOM_ANIMAL[moiP.animal] : 'Pas encore choisi')),
    el('button', { class: 'btn second', onclick: () => { vue = 'animal'; rendre(); } }, moiP && moiP.animal ? 'Changer' : 'Choisir')));

  const champPrenom = el('input', { type: 'text', maxlength: 20, value: moiP ? moiP.prenom : '' });
  bloc.append(el('form', { class: 'reglage', onsubmit: async (ev) => {
    ev.preventDefault();
    try { await appel('mon_prenom', { prenom: champPrenom.value }); await charger(); vue = 'reglages'; rendre(); toast('Prénom changé'); }
    catch (err) { toast(err.message); }
  }},
    el('label', {}, 'Mon prénom'), champPrenom,
    el('div', { class: 'rangee' }, el('button', { class: 'btn second', type: 'submit' }, 'Changer'))));

  bloc.append(el('div', { class: 'reglage' },
    el('p', {}, el('strong', {}, 'Sur l\'écran d\'accueil'), el('br'),
      el('span', { class: 'discret' }, 'Sur iPhone : bouton Partager de Safari, puis « Sur l\'écran d\'accueil ». Sur Android : menu ⋮ de Chrome, puis « Ajouter à l\'écran d\'accueil ».'))));

  bloc.append(el('div', { class: 'reglage' },
    el('p', {}, el('strong', {}, 'Mon lien de secours'), el('br'),
      el('span', { class: 'discret' }, 'Range-le parmi tes mots de passe. Sur un nouveau téléphone, installe La Casquette, ouvre-la et colle-le : tu retrouves '
        + (etat.groupes.length > 1 ? 'tes ' + etat.groupes.length + ' groupes' : 'ta liste') + (cleGestion() ? (etat.groupes.length > 1 ? ' et leur gestion' : ' et sa gestion') : '')
        + '. Il te représente : ne le donne à personne. Si tu rejoins un autre groupe, copie-le à nouveau.')),
    el('button', { class: 'btn second', onclick: async () => {
      const url = lienSecours();
      try { await navigator.clipboard.writeText(url); toast('Lien de secours copié'); }
      catch (e) { prompt('Copie ton lien de secours :', url); }
    }}, 'Copier mon lien de secours')));

  bloc.append(el('div', { class: 'reglage' },
    el('p', {}, el('strong', {}, 'Importer depuis Mes Cadeaux'), el('br'),
      el('span', { class: 'discret' }, 'Dans Mes Cadeaux, exporte ta liste, puis choisis ici le fichier obtenu. Tes idées arrivent dans « À offrir », visibles par toi seule.')),
    boutonImport('Choisir le fichier')));

  if (moi.admin && d.admin) bloc.append(blocTirages());
  if (moi.admin && d.admin) bloc.append(blocGestion());

  bloc.append(el('div', { class: 'reglage' },
    el('p', {}, el('strong', {}, 'Quitter le groupe'), el('br'),
      el('span', { class: 'discret' }, 'Ta liste et tes réservations sont effacées. Si tu avais réservé quelque chose, c\'est de nouveau libre.')),
    el('button', { class: 'btn danger', onclick: quitter }, 'Quitter le groupe')));

  bloc.append(el('button', { class: 'btn lien retour', onclick: () => { vue = 'moi'; rendre(); } }, '← Retour à ma liste'));
  return bloc;
}

function blocGestion() {
  const zone = el('div', { class: 'reglage' });
  const champNom = el('input', { type: 'text', maxlength: 40, value: donnees.nom || '' });
  const liste = el('div', {}, el('p', { class: 'discret' }, 'Chargement des membres…'));
  zone.append(
    el('p', {}, el('strong', {}, 'Gestion du groupe'), el('br'),
      el('span', { class: 'discret' }, 'Toi seule vois cette partie : ce téléphone garde la clé de gestion.')),
    el('form', { onsubmit: async (ev) => {
      ev.preventDefault();
      try { await appel('renommer', { nom: champNom.value }); await charger(); vue = 'reglages'; rendre(); toast('Groupe renommé'); }
      catch (err) { toast(err.message); }
    }},
      el('label', {}, 'Nom du groupe'), champNom,
      el('div', { class: 'rangee' }, el('button', { class: 'btn second', type: 'submit' }, 'Renommer'))),
    el('label', { style: 'margin-top:18px' }, 'Membres'), liste,
    el('label', { style: 'margin-top:18px' }, 'Le lien a circulé trop loin ?'),
    el('p', { class: 'discret' }, 'Un nouveau lien rend l\'ancien inutilisable. Les membres actuels suivent automatiquement.'),
    el('button', { class: 'btn second', onclick: changerLien }, 'Changer le lien du groupe')
  );
  appel('membres').then(r => {
    liste.replaceChildren(...r.membres.map(m => el('div', { class: 'membre' },
      pastille(m.animal, m.prenom, 34),
      el('div', { style: 'flex:1' }, m.prenom + (m.moi ? ' (toi)' : ''),
        el('div', { class: 'discret' }, 'Arrivée le ' + new Date(m.arrivee).toLocaleDateString('fr-BE') + (m.parrain ? ', invitée par ' + m.parrain : ''))),
      m.moi ? null : el('button', { class: 'btn lien', onclick: () => retirerMembre(m) }, 'Retirer'))));
  }).catch(err => liste.replaceChildren(el('p', { class: 'discret' }, err.message)));
  return zone;
}

async function inviter() {
  const url = lienInvitation();
  const texte = 'Rejoins notre groupe sur La Casquette pour partager nos listes d\'envies :';
  if (navigator.share) {
    try { await navigator.share({ title: 'La Casquette', text: texte, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Lien copié'); }
  catch (e) { prompt('Copie ce lien :', url); }
}

async function changerLien() {
  if (!confirm('Créer un nouveau lien ? L\'ancien ne fonctionnera plus pour les nouvelles personnes.')) return;
  try {
    const r = await appel('changer_lien');
    moi.g = r.g; garder(moi);
    await charger(); vue = 'reglages'; rendre();
    toast('Nouveau lien prêt. Partage-le si besoin.');
  } catch (err) { toast(err.message); }
}

async function retirerMembre(m) {
  if (!confirm('Retirer ' + m.prenom + ' du groupe ? Sa liste et ses réservations seront effacées.')) return;
  try { await appel('retirer_membre', { p: m.p }); await charger(); vue = 'reglages'; rendre(); toast(m.prenom + ' a été retirée'); }
  catch (err) { toast(err.message); }
}

async function quitter() {
  const msg = moi.admin
    ? 'Quitter le groupe' + (moi.nom ? ' « ' + moi.nom + ' »' : '') + ' ? Tu le gères : sans toi, plus personne ne pourra le gérer.'
    : 'Quitter le groupe ? Ta liste et tes réservations seront effacées.';
  if (!confirm(msg)) return;
  try { await appel('quitter'); } catch (err) { if (err.statut !== 403) return toast(err.message); }
  oublier(); donnees = null;
  if (moi) { choisirGroupe(etat.actif); toast('Tu as quitté ce groupe'); } else ecranAccueil();
}

/* ---------- Démarrage ---------- */
function demarrer() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('s')) return restaurer(h.get('s'));
  const g = h.get('g');
  if (g && /^[0-9a-f]{18}$/.test(g)) {
    const i = etat.groupes.findIndex(x => x.g === g);
    if (i >= 0) {
      history.replaceState(null, '', location.pathname + location.search);
      return choisirGroupe(i);
    }
    return ecranRejoindre(g, (h.get('p') || '').replace(/[^0-9a-f]/g, '').slice(0, 10));
  }
  if (moi && moi.m) return charger();
  ecranAccueil();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && moi && moi.m && donnees && edition === null) charger();
});

if ('serviceWorker' in navigator && !EN_LOCAL) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

demarrer();
</script>
</body>
</html>
